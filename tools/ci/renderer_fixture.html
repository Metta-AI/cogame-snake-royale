<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>snake-royale renderer fixture</title>
<style>
  html, body { margin: 0; background: #120d09; color: #f2e8d8;
    font-family: system-ui, sans-serif; }
  .frame { display: inline-block; margin: 4px; vertical-align: top; }
  .frame span { font-size: 10px; color: #8a7f72; }
  canvas { display: block; background: #16110d; }
</style>
</head>
<body>
<!--
  The worst-case text chrome, driven against the SHIPPED renderer and the
  SHIPPED page.

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so every seat in
  the CI replay plays a scripted baseline and a scripted baseline emits no
  `say` at all: the smoke replay carries ZERO LLM text, and nothing that plays
  it can ever draw the say bubble (the cogchemists 2026-08-24 scar).

  WHICH GATE COVERS WHICH SURFACE (the coverage claim, stated so it can be
  checked):

    * ci.yml's "Load the bundle in a real browser" step runs the real static
      bundle. That bundle draws in a WORKER on an OffscreenCanvas
      (static_replay.js: `canvas.transferControlToOffscreen()`), and
      viewer_smoke.mjs patches `CanvasRenderingContext2D` in the PAGE, so its
      `canvas_text` totals are 0 there BY CONSTRUCTION. That step is the gate
      on load, on advancement (--soak) and on the scrubber, NOT on text
      bounds.
    * THIS fixture is the text-bounds gate. It loads the shipped
      broadcast_core.js -- the same file the Worker imports, not a
      re-implementation of it (the particle-worlds 2026-08-26 scar) -- on a
      MAIN-THREAD canvas, so every fillText the renderer makes is measured.
      It drives a full-cap 24-rune `say` on all four seats INCLUDING a snake
      on the top row (the negative-y bubble case), a three-way head-on, a
      trapped snake, and all three modules' board shapes, at 360, 640 and
      1024 px.
    * The fixture also mounts the shipped index.html in an iframe and drives
      the page's OWN frame path, with a real
      roster, a real beat list, a real length series and a real duel turn, so
      the scorebug plates, the seven beat markers, the length ribbon, the duel
      banner, the match feed and the endcard (design §Tests 48) are exercised
      by the same code the hosted viewer runs. It then asserts the endcard
      comes back DOWN on a seek to a mid-match frame.

  Success is the same signal the real shell uses: data-replay-loaded="true" on
  <html> once every frame has drawn and every chrome assertion has held.
  Any failure sets data-replay-error, which viewer_smoke.mjs fails fast on.
-->
<div id="frames"></div>
<iframe id="shell" src="./index.html" width="360" height="203"
        style="border:0;opacity:0.001;position:absolute;left:-9999px"></iframe>
<script src="./wire_constants.js"></script>
<script src="./chrome_common.js"></script>
<script src="./broadcast_core.js"></script>
<script>
(function () {
  'use strict';

  var CAP = (window.SNAKE_WIRE && window.SNAKE_WIRE.maxSayRunes) || 24;
  // Exactly the server's cap, in the widest characters the sanitiser allows.
  var SAY = 'WWWWWWWWWWWWWWWWWWWWWWWW'.slice(0, CAP);
  var COLOURS = (window.SNAKE_WIRE && window.SNAKE_WIRE.colours) ||
    ['amber', 'teal', 'violet', 'lime'];
  var ALIASES = ['COG-alpha', 'COG-beta', 'COG-gamma', 'COG-delta'];
  var NAMES = ['daveey', 'daveey-1', 'Baseline (1)', 'Baseline (2)'];
  var TURNS = 40;
  var DUEL = 26;

  function failed(message) {
    document.documentElement.setAttribute('data-replay-error', message);
  }

  function body(cells) { return cells; }

  // A real roster: the four seats the scorebug plates draw, with the real
  // policy name beside the in-game alias, a place badge on the dead seat, a
  // health bar, a trapped seat and a fallback glyph.
  function roster(seats) {
    var out = [];
    for (var i = 0; i < 4; i++) {
      var s = seats[i];
      out.push({
        s: i, name: NAMES[i], alias: ALIASES[i], colour: COLOURS[i],
        alive: s.alive !== false, len: s.body.length,
        hp: s.hp == null ? 30 : s.hp, free: s.free == null ? 40 : s.free,
        trapped: !!s.trapped, place: i + 1,
        kind: i < 2 ? 'llm' : 'scripted', fallback: i === 1
      });
    }
    return out;
  }

  // A real length series across the whole episode, full width from turn 0 --
  // what the pre-scan hands the ribbon on the first frame.
  function leadPts() {
    var pts = [];
    for (var t = 0; t <= TURNS; t++) {
      pts.push([t, 3 + (t >> 1), 3 + (t >> 2), Math.max(0, 6 - (t >> 3)),
                3 + (t % 5)]);
    }
    return pts;
  }

  // One beat of every emitted kind, so all seven CSS rules and all seven
  // labels are exercised.
  function beats() {
    return [
      { t: 4, k: 'eat', slot: 0, label: 'COG-alpha eats — length 4 — click to jump here' },
      { t: 9, k: 'trapped', slot: 1, label: 'COG-beta is trapped — click to jump here' },
      { t: 14, k: 'headon', slot: 2, label: 'Head-on — click to jump here' },
      { t: 18, k: 'fallback', slot: -1, label: 'COG-alpha missed the call — click to jump here' },
      { t: 21, k: 'death', slot: 3, label: 'COG-delta is out — click to jump here' },
      { t: DUEL, k: 'duel', slot: -1, label: 'Two snakes left — half speed — click to jump here' },
      { t: TURNS, k: 'gameover', slot: -1, label: 'Last snake standing — click to jump here' }
    ];
  }

  function results() {
    return {
      names: NAMES, aliases: ALIASES, colours: COLOURS,
      scores: [1.0, 0.333, -0.333, -1.0], win: [true, false, false, false],
      place: [1, 2, 3, 4], reason: 'complete', endRule: 'last_standing',
      module: 'royale', turnsPlayed: TURNS,
      survivedTurns: [40, 39, 30, 11], finalLength: [11, 8, 6, 4],
      foodEaten: [8, 5, 3, 1], declinedKills: [0, 3, 1, 0]
    };
  }

  function chromeDoc(board, seats, turn, over) {
    return {
      t: turn, st: 0, mx: TURNS, mt: 50, turn: turn, turns: TURNS,
      ph: over ? 'gameover' : 'playing',
      lob: 0, sp: 1, pl: true, lp: false, sk: false, ff: false, en: true,
      over: over, alive: over ? 1 : 4, module: board.module,
      moduleLine: board.module + ' · ' + board.w + '×' + board.h +
        ' · walls · food 3 · health on',
      boardW: board.w, boardH: board.h, wrap: board.wrap, duel: DUEL,
      mismatch: -1, roster: roster(seats), beats: beats(),
      lulls: [[6, 11]],
      lead: { teams: ['s0', 's1', 's2', 's3'], pts: leadPts() },
      feed: [
        { k: 'say', slot: 0, row: 'COG-alpha: "' + SAY + '"' },
        { k: 'eat', slot: 1, row: 'COG-beta eats — length 6' },
        { k: 'trapped', slot: 2, row: 'COG-gamma is TRAPPED — 4 free cells, length 6' },
        { k: 'fallback', slot: 3, row: 'COG-delta MISSED THE CALL — coil move (timeout)' }
      ],
      results: over ? results() : null
    };
  }

  function packet(board, seats) {
    var snakes = [];
    for (var i = 0; i < 4; i++) {
      var s = seats[i];
      snakes.push({
        slot: i, alias: ALIASES[i], name: NAMES[i],
        colour: COLOURS[i], alive: s.alive !== false,
        body: body(s.body), prev: body(s.body),
        length: s.body.length, health: s.hp == null ? 30 : s.hp,
        free: s.free == null ? 40 : s.free, trapped: !!s.trapped,
        ate: !!s.ate, dir: i % 4, died: false
      });
    }
    var bubbles = [];
    for (var k = 0; k < 4; k++) {
      bubbles.push({ slot: k, text: SAY,
        x: seats[k].body[0][0], y: seats[k].body[0][1] });
    }
    return {
      protocol: 'snake-royale/v1',
      board: board,
      alpha: 400,
      snakes: snakes,
      food: [[1, 1], [board.w - 2, board.h - 2]],
      bubbles: bubbles,
      // A three-way head-on in one cell: the flash must be drawn, never a
      // silent disappearance.
      flashes: [{ k: 'headon', x: (board.w >> 1), y: (board.h >> 1), slot: 0 },
                { k: 'eat', x: 1, y: 1, slot: 1 }],
      chrome: chromeDoc(board, seats, 12, false)
    };
  }

  // All three shipped board shapes, and a snake on the TOP ROW in each so the
  // bubble has nowhere above it to go.
  var BOARDS = [
    { w: 17, h: 9, wrap: false, cellPx: 32, trail: false, module: 'royale' },
    { w: 11, h: 7, wrap: true, cellPx: 32, trail: false, module: 'geese' },
    { w: 21, h: 9, wrap: false, cellPx: 32, trail: true, module: 'tron' }
  ];
  var WIDTHS = [360, 640, 1024];

  function seatsFor(board) {
    return [
      { body: [[2, 0], [2, 1], [2, 2]], trapped: false },
      { body: [[board.w - 3, 0], [board.w - 3, 1], [board.w - 3, 2]],
        trapped: true, free: 2 },
      { body: [[2, board.h - 1], [3, board.h - 1], [4, board.h - 1]],
        ate: true },
      { body: [[board.w - 3, board.h - 1], [board.w - 4, board.h - 1]],
        hp: 3, alive: false }
    ];
  }

  var host = document.getElementById('frames');
  var drawn = 0;
  BOARDS.forEach(function (board) {
    WIDTHS.forEach(function (width) {
      var wrap = document.createElement('div');
      wrap.className = 'frame';
      var label = document.createElement('span');
      label.textContent = board.module + ' @ ' + width + 'px';
      var canvas = document.createElement('canvas');
      var height = Math.round(width * 203 / 360);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvas.width = width;
      canvas.height = height;
      wrap.appendChild(label);
      wrap.appendChild(canvas);
      host.appendChild(wrap);
      var core = window.BroadcastCore.create({
        canvas: canvas, websocket: false, playoutBuffer: false,
        viewportWidth: width, viewportHeight: height, devicePixelRatio: 1,
        onText: function () { }, onStatus: function () { },
        onFirstFrame: function () { drawn++; }
      });
      core.start();
      core.ingest(JSON.stringify(packet(board, seatsFor(board))));
    });
  });

  // ---------------------------------------------------------------------
  // The shipped page's own chrome block, driven with the same real data.
  // ---------------------------------------------------------------------
  function driveShell(win) {
    var drive = win.SNAKE_DRIVE_FRAME;
    if (typeof drive !== 'function') {
      return 'the shipped page did not publish SNAKE_DRIVE_FRAME';
    }
    var board = BOARDS[0];
    var seats = seatsFor(board);
    // One frame down the page's OWN frame path: the clock, the transport, the
    // lull spans, the length ribbon, the mismatch line and then the appended
    // block's plates, feed, beats, duel banner and endcard.
    drive(JSON.stringify(chromeDoc(board, seats, 30, false)));

    var doc = win.document;
    var plates = doc.querySelectorAll('#plates-l .plate, #plates-r .plate');
    if (plates.length !== 4) {
      return 'the scorebug drew ' + plates.length + ' plates, not 4';
    }
    var names = doc.querySelectorAll('.plate-name');
    if (!names.length || names[0].textContent !== NAMES[0]) {
      return 'the scorebug plate does not carry the real policy name';
    }
    var markers = doc.querySelectorAll('#scrub .beat-marker');
    if (markers.length !== beats().length) {
      return 'the scrubber drew ' + markers.length + ' beat markers, not ' +
        beats().length;
    }
    for (var i = 0; i < markers.length; i++) {
      if (markers[i].tagName !== 'BUTTON' ||
          !markers[i].getAttribute('aria-label')) {
        return 'beat marker ' + i + ' is not a labelled button';
      }
    }
    var momentum = doc.querySelector('#momentum');
    if (!momentum || !momentum.querySelector('path')) {
      return 'the length ribbon drew nothing from the pre-scan series';
    }
    var feed = doc.querySelectorAll('#killfeed .feed-row');
    if (!feed.length) return 'the match feed drew no rows';
    var said = false;
    for (var f = 0; f < feed.length; f++) {
      if (feed[f].textContent.indexOf(SAY) >= 0) said = true;
    }
    if (!said) return 'the feed never drew the full-cap say row';
    if (!doc.querySelector('#bannerlane .banner-chip.duel')) {
      return 'the duel banner never fired at the duel turn';
    }

    // The endcard goes up at the end...
    drive(JSON.stringify(chromeDoc(board, seats, TURNS, true)));
    var card = doc.querySelector('#endcard');
    if (!card || card.className.indexOf('on') < 0) {
      return 'the endcard did not come up on the final frame';
    }
    if (doc.querySelectorAll('#ec-teams .ec-row').length !== 4) {
      return 'the endcard table is not four rows';
    }
    // ...and every seek takes it back down (checklist 14c).
    drive(JSON.stringify(chromeDoc(board, seats, 12, false)));
    if (card.className.indexOf('on') >= 0) {
      return 'the endcard stayed up after a seek back into the match';
    }
    return '';
  }

  var shell = document.getElementById('shell');
  var settled = false;
  function settle() {
    if (settled) return;
    settled = true;
    // Self-check: the cap the server enforces is the cap this fixture drove.
    if (SAY.length !== CAP) {
      failed('fixture say length ' + SAY.length + ' is not the server cap ' + CAP);
      return;
    }
    if (drawn !== BOARDS.length * WIDTHS.length) {
      failed('only ' + drawn + ' of ' + (BOARDS.length * WIDTHS.length) +
        ' fixture frames drew');
      return;
    }
    var why;
    try {
      why = driveShell(shell.contentWindow);
    } catch (error) {
      why = 'the shipped chrome threw: ' + (error && error.message || error);
    }
    if (why) { failed(why); return; }
    document.documentElement.setAttribute('data-replay-loaded', 'true');
  }
  shell.addEventListener('load', function () { setTimeout(settle, 250); });
  // The shell is a local file behind a local server; if it has not loaded in
  // 20 s something is wrong with the bundle itself, and a hang here would only
  // show up as the harness's timeout.
  setTimeout(function () {
    if (!settled) failed('the shipped index.html did not load in 20 s');
  }, 20000);
})();
</script>
</body>
</html>
