# CI for a Coworld game repo (Metta-AI/cogame-snake-royale).
#
# Goes to:  .github/workflows/ci.yml  in the coworld repo.
# Substitute: snake-royale  (lowercase game slug, e.g. bullwhip)
#             coworld-snake-royale (local image name WITHOUT a tag, must match the image in
#                      compose.yaml minus ":latest", e.g. coworld-bullwhip)
#             4 (seat count -- a CROSS-CHECK, not a fallback:
#                      docker_smoke.sh takes the seat count solely from
#                      certification.game_config.num_agents and hard-fails if
#                      this value disagrees with it)
#
# The coworld-builder sandbox has no docker, no nim, no emsdk and no browser:
# this workflow is the ONLY place those toolchains run. Phase 20's exit
# criterion is this workflow green on main.
#
# It also needs tools/ci/viewer_smoke.mjs (copied verbatim from coworld-builder
# templates/tools/ci/; no substitutions) -- the wasm-viewer job opens the built
# bundle in headless chromium and fails if the replay never renders.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLUG: snake-royale
  IMAGE: coworld-snake-royale
  # Pins mirror the Dockerfile build stage; bump both together.
  NIMBY_VERSION: "0.1.26"
  NIM_VERSION: "2.2.4"

jobs:
  # ---------------------------------------------------------------------
  # A GameVersion is claimed across BRANCHES and nothing else in the build
  # enforces that: two branches can each be current with main and still pick
  # the same next number, because neither can see the other's choice. The
  # collision lands silently and an old replay then re-simulates WRONG while
  # still loading, which is worse than a refusal.
  # tools/ci/check_gameversion.sh (coworld-ctf's, one path edit) compares the
  # RULE HEADLINE the number is attached to, not the number. Seconds, and
  # isolated from the shards.
  # ---------------------------------------------------------------------
  gameversion-tripwire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: GameVersion is not a number the base already spent
        run: |
          set -euo pipefail
          test -x tools/ci/check_gameversion.sh || {
            echo "::error::tools/ci/check_gameversion.sh must be executable"; exit 1; }
          git fetch --no-tags --depth=1 origin '${{ github.base_ref }}'
          tools/ci/check_gameversion.sh FETCH_HEAD

  # ---------------------------------------------------------------------
  # Native Nim tests. Same nimby recipe as the Dockerfile build stage, so a
  # green test job means the image's compiler and package tree agree.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) asset="nimby-Linux-X64" ;;
            arm64) asset="nimby-Linux-ARM64" ;;
            *) echo "::error::unsupported runner arch: $arch"; exit 1 ;;
          esac
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/${asset}"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: |
          set -euo pipefail
          if [ -f nimby.lock ]; then
            nimby --global sync nimby.lock
          else
            echo "no nimby.lock in the repo; skipping dependency sync"
          fi

      - name: Regenerate nim.cfg from the synced package tree
        # The committed nim.cfg pins the AUTHOR's machine package paths. Rebuild
        # it from this runner's ~/.nimby/pkgs, exactly as the Dockerfile does.
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg
          echo "::group::nim.cfg"
          cat nim.cfg
          echo "::endgroup::"

      - name: Sweep and verify the scripted-baseline tuning
        # The tunables are SWEPT, NOT GUESSED. --sweep prints the whole matrix
        # over the fixed 24-episode ladder (that record is what pins the
        # shipped pick); --check fails if the shipped constants have drifted
        # from tools/ci/baseline_tuning.json.
        run: |
          set -euo pipefail
          nim r --hints:off -d:release --path:src tools/tune_baselines.nim \
            --sweep --check

      - name: Run tests
        # Every tests/*.nim runs twice: debug (range/overflow checks, stack
        # traces) and -d:release (release-only compile errors and codegen bugs
        # that debug runs never see). Repo variables narrow that:
        #   NIM_TESTS               space-separated test files (default tests/*.nim)
        #   NIM_TESTS_DEBUG_ONLY    files to run ONLY in debug
        #   NIM_TESTS_RELEASE_ONLY  files to run ONLY in release
        env:
          NIM_TESTS: ${{ vars.NIM_TESTS }}
          NIM_TESTS_DEBUG_ONLY: ${{ vars.NIM_TESTS_DEBUG_ONLY }}
          NIM_TESTS_RELEASE_ONLY: ${{ vars.NIM_TESTS_RELEASE_ONLY }}
        run: |
          set -uo pipefail
          tests="${NIM_TESTS:-}"
          if [ -z "${tests}" ]; then
            tests="$(ls tests/*.nim 2>/dev/null | tr '\n' ' ')"
          fi
          if [ -z "$(echo "${tests}" | tr -d ' ')" ]; then
            echo "::error::no test files found (tests/*.nim empty and NIM_TESTS unset)"
            exit 1
          fi
          fail=0
          for t in ${tests}; do
            if [ ! -f "${t}" ]; then
              echo "::error::test file not found: ${t}"
              fail=1
              continue
            fi
            modes="debug release"
            case " ${NIM_TESTS_DEBUG_ONLY} " in *" ${t} "*) modes="debug" ;; esac
            case " ${NIM_TESTS_RELEASE_ONLY} " in *" ${t} "*) modes="release" ;; esac
            for m in ${modes}; do
              if [ "${m}" = "release" ]; then
                flags="--hints:off -d:release"
              else
                flags="--hints:off"
              fi
              echo "::group::nim r ${flags} --path:src ${t}"
              # shellcheck disable=SC2086
              if ! nim r ${flags} --path:src "${t}"; then
                echo "::error::FAILED (${m}) ${t}"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "${fail}"

      - uses: astral-sh/setup-uv@v6

      - name: Validate the manifest under the installed coworld CLI
        # Design note §Tests 38. The Nim test asserts the manifest's own pins;
        # this asserts the PLATFORM's reading of it, through the same two
        # functions `coworld build` calls -- _load_template_manifest, which
        # substitutes the compose image placeholder and then runs
        # validate_upload_manifest. 0.1.42+ wants game.replay_viewer, no
        # top-level version, no game.display_name, game.owner present and no
        # runner-managed tokens in a game_config (the collab-cooking
        # 2026-08-25 scar), and every one of those is a model error here
        # rather than a rejected upload three phases later.
        run: |
          set -euo pipefail
          uv run --no-project --with "coworld==0.1.43" python - <<'PY'
          import json
          from coworld.bundle import _load_template_manifest

          document = json.load(open("coworld_manifest_template.json"))
          runtime = _load_template_manifest(
              document, "0.1.0",
              {"{{SNAKE_ROYALE_IMAGE}}": "coworld-snake-royale:ci"})
          assert runtime.game.name == "snake-royale", runtime.game.name
          assert runtime.game.replay_viewer.bundle == "static-replay-viewer", \
              runtime.game.replay_viewer
          assert [v.id for v in runtime.variants] == ["royale", "geese", "tron"]
          assert len(runtime.certification.players) == 4
          assert runtime.game.runnable.image == "coworld-snake-royale:ci"
          print("manifest validates under coworld 0.1.43:",
                runtime.game.name, runtime.game.version,
                [v.id for v in runtime.variants])
          PY

      - name: The release version picker's own self-test
        # tools/ci/next_coworld_version.py is what the release workflow uses to
        # pick the next publish number past an orphan row; its self-test is the
        # starter's and runs here so a stdlib-only helper cannot rot unnoticed.
        run: python3 tools/ci/test_next_coworld_version.py

  # ---------------------------------------------------------------------
  # Packaging smoke: the production image builds, and one real episode runs
  # end to end in raw docker with the certification fixture's seat mix.
  # ---------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Invoked by path, not through `bash`: a `bash SCRIPT` call ignores the exec
      # bit, so a 0644 helper would go green here and only fail wherever it is
      # executed directly.
      - name: Assert the smoke script is present and executable
        run: |
          set -euo pipefail
          test -f tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh is missing"; exit 1; }
          test -x tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh must be committed executable (mode 100755)."
            echo "::error::Fix with: git update-index --chmod=+x tools/ci/docker_smoke.sh"
            exit 1; }

      - name: Build image
        run: docker build --platform=linux/amd64 -t "${IMAGE}:ci" .

      - name: Raw-Docker episode smoke
        # SMOKE_SLUG is passed explicitly so the workflow's SLUG is the single
        # source for the game/player entrypoint names; the script's own
        # scaffold-substituted default is only a fallback.
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
          # The replay is the starter's binary COWLDSNK stream, not JSON: the
          # static wasm viewer parses exactly these bytes and re-simulates
          # them. tools/replay_summary.py is the strict-UTF-8-JSON view of a
          # replay for anyone holding the file.
          SMOKE_REQUIRE_REPLAY_JSON: "0"
          # ...so the artifact is named for what it holds. The shared script's
          # default path ends in .json, which described the bytes for a game
          # whose replay IS json and does not describe these. The viewer step
          # below globs *.replay first.
          SMOKE_REPLAY_OUT: ${{ github.workspace }}/dist/smoke/episode.replay
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The replay this episode produced is the ONLY replay in CI that is
      # known to be a real, current-format episode of this game. wasm-viewer
      # downloads it and loads it in a browser, so the viewer is tested
      # against the bytes the platform will actually serve rather than a
      # hand-written fixture that can drift.
      - name: Upload the smoke replay
        uses: actions/upload-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # The static replay viewer. The platform serves THIS bundle from
  # /v2/coworlds/replays/static/<cow_id>/<sha>/index.html, so a bundle that
  # does not build (or is missing its wasm) means every hosted replay hangs.
  # tools/build_replay_viewer.sh falls back to the pinned emscripten/emsdk
  # container (Dockerfile.replay-viewer) because the runner has no emcc.
  # ---------------------------------------------------------------------
  wasm-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The bundle is EXECUTED here, not merely built, and it is executed against
    # the replay docker-smoke just produced -- hence the dependency.
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # `coworld build` (bundle.py) refuses to package a source replay-viewer
      # bundle unless the hook is BOTH a file and os.X_OK:
      #   "Coworld builds with a source replay viewer bundle require an
      #    executable build hook".
      # Running it as `bash tools/build_replay_viewer.sh` would ignore the exec
      # bit entirely, so a mode-0644 hook passed CI and only blew up later, in
      # coworld-release.yml's "Build the Coworld manifest". Assert the bit, then
      # invoke by path so CI exercises exactly what `coworld build` requires.
      - name: Assert the replay-viewer build hook is present and executable
        run: |
          set -euo pipefail
          test -f tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh is missing; coworld build needs it"
            echo "::error::to emit the static replay bundle"
            exit 1; }
          test -x tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh must be committed executable (mode 100755):"
            echo "::error::coworld build hard-requires os.X_OK on the build hook."
            echo "::error::Fix with: git update-index --chmod=+x tools/build_replay_viewer.sh"
            exit 1; }

      - name: Assert the viewer load test is present
        run: |
          set -euo pipefail
          test -s tools/ci/viewer_smoke.mjs || {
            echo "::error::tools/ci/viewer_smoke.mjs is missing. It is the only gate that"
            echo "::error::EXECUTES the replay viewer; without it a bundle that deadlocks"
            echo "::error::(cogame-lantern, 2026-08-23) ships green. Copy it from"
            echo "::error::coworld-builder templates/tools/ci/viewer_smoke.mjs."
            exit 1; }

      - name: Build the static replay viewer bundle
        run: ./tools/build_replay_viewer.sh "$PWD/dist/static-replay-viewer"

      - name: Assert the bundle is complete
        run: |
          set -euo pipefail
          out="$PWD/dist/static-replay-viewer"
          test -s "${out}/index.html" || {
            echo "::error::${out}/index.html missing or empty"; exit 1; }
          wasm_count="$(find "${out}" -name '*.wasm' -size +1c | wc -l | tr -d ' ')"
          if [ "${wasm_count}" -lt 1 ]; then
            echo "::error::no non-empty .wasm module in ${out}"
            find "${out}" -type f | sed 's/^/  /'
            exit 1
          fi
          echo "bundle OK:"
          find "${out}" -type f -printf '  %p (%s bytes)\n'

      # -----------------------------------------------------------------
      # The load test. Everything above only proves files EXIST. cogame-lantern
      # shipped a viewer whose emscripten link flags (MODULARIZE / EXPORT_NAME)
      # and whose JS bootstrap came from two different starters: the factory was
      # never called, no error was thrown, and softmax.com sat on
      # "Loading replay..." forever with every file present and 200. Only
      # opening the page in a browser sees that.
      #
      # Playwright is pinned to 1.55.0 in BOTH places -- the npm module and the
      # browser download. Bump them together or the browser 404s.
      # -----------------------------------------------------------------
      - name: Download the smoke replay
        uses: actions/download-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the wasm module against the committed fixtures
        # The native shards run 64-bit: `int` is 64 bits and a multi-GB
        # allocation succeeds. The SHIPPED viewer is --cpu:wasm32, where `int`
        # is 32 bits (overflow checks trap on arithmetic that is silently fine
        # natively) and the address space ends at 2 GB. Both classes of bug
        # have reached prod invisible to a green native suite. This runs the
        # EXACT emitted module, headless, over each committed fixture -- one
        # per rule module -- and fails on a load rejection, an empty packet, a
        # dead frame or a hash mismatch against the recording.
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=(tests/fixtures/*.replay)
          test "${#fixtures[@]}" -eq 3 || {
            echo "::error::expected three committed fixtures in tests/fixtures,"
            echo "::error::found ${#fixtures[@]}. Re-record with tools/record_fixture.sh."
            exit 1; }
          for fixture in "${fixtures[@]}"; do
            echo "::group::wasm_replay_smoke ${fixture}"
            node tools/wasm_replay_smoke.cjs dist/static-replay-viewer "${fixture}" 300
            echo "::endgroup::"
          done

      - name: Install Playwright (pinned 1.55.0)
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Load the bundle in a real browser
        run: |
          set -euo pipefail
          # A for-loop, not `ls … | head -1`: under `set -o pipefail` an unmatched
          # glob makes ls exit 2 and kills the step before the harness ever runs
          # (cogame-raid 2026-08-23, run 32623414696).
          replay=""
          for candidate in dist/smoke/*.replay dist/smoke/replay.json; do
            if [ -f "${candidate}" ]; then replay="${candidate}"; break; fi
          done
          test -n "${replay}" || {
            echo "::error::docker-smoke uploaded no replay to dist/smoke"; ls -la dist/smoke || true; exit 1; }
          echo "loading ${replay} in dist/static-replay-viewer"
          # --strict-text-bounds is carried here too, but READ WHAT IT COVERS:
          # this bundle draws in a WORKER on an OffscreenCanvas
          # (static_replay.js: canvas.transferControlToOffscreen()), and
          # viewer_smoke.mjs patches CanvasRenderingContext2D in the PAGE, so
          # `canvas_text` is reported as total 0 here BY CONSTRUCTION -- "the
          # check covered nothing", not "nothing was wrong". The gate that
          # measures drawn strings is the renderer-fixture step below, which
          # loads the same shipped broadcast_core.js on a MAIN-THREAD canvas.
          # THIS step is the gate on: the bundle loading at all
          # (data-replay-loaded), playback advancing (--soak 10) and the
          # scrubber seeking (the 0 %/50 %/100 % clock readouts in
          # viewer-smoke.json).
          # --soak 10: uninterrupted playback must keep advancing. A 40-turn
          # certification replay plays for 20 s at 12 render frames per turn,
          # so the soak observes real advancement rather than a legitimately
          # finished replay (the ecos 2026-08-23 scar).
          node tools/ci/viewer_smoke.mjs \
            --bundle dist/static-replay-viewer \
            --replay "${replay}" \
            --timeout 90 \
            --soak 10 \
            --strict-text-bounds

      - name: Drive the worst-case text chrome (renderer fixture)
        # THE TEXT-BOUNDS GATE. docker_smoke.sh runs with NO ANTHROPIC_API_KEY,
        # so every seat in the CI replay plays scripted and a scripted baseline
        # emits no `say` at all: the smoke replay can never exercise the say
        # bubble or the feed's say path (the cogchemists 2026-08-24 scar). And
        # the bundle step above draws in a Worker, where the harness's
        # main-thread canvas patch cannot see a single fillText.
        #
        # This fixture closes both gaps. It loads the SHIPPED
        # dist/static-replay-viewer/broadcast_core.js -- the same file the
        # Worker imports, not a re-implementation of it (the particle-worlds
        # 2026-08-26 scar) -- on a MAIN-THREAD canvas at 360/640/1024 px on all
        # three board shapes, with a full-cap 24-rune `say` on all four seats
        # including one on the top row, so --strict-text-bounds measures real
        # draws: the step log prints the `canvas text: N drawn, 0 never
        # inside` line and fails the job on a regression.
        # It ALSO mounts the shipped index.html in an iframe and drives the
        # page's own frame path with a real roster, a real beat list, a real
        # length series, a real duel turn, a full-cap say feed row and a real
        # results document, so the scorebug plates, the seven beat markers,
        # the length ribbon, the duel banner, the feed and the endcard (design
        # §Tests 48) are exercised -- including that a seek back into the match
        # takes the endcard down.
        run: |
          set -euo pipefail
          cp tools/ci/renderer_fixture.html dist/static-replay-viewer/renderer_fixture.html
          python3 -m http.server 8731 --directory dist/static-replay-viewer \
            >/tmp/fixture-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:8731/renderer_fixture.html" >/dev/null; then break; fi
            sleep 0.5
          done
          node tools/ci/viewer_smoke.mjs \
            --url "http://127.0.0.1:8731/renderer_fixture.html" \
            --timeout 90 \
            --out "$PWD/fixture" \
            --strict-text-bounds

      - name: Upload the viewer smoke evidence
        # Always: the screenshot and the JSON are most useful when the job is
        # red. BOTH runs are uploaded -- the bundle's (root) and the renderer
        # fixture's (fixture/) -- because the fixture's canvas_text line is the
        # only evidence about drawn strings and it must not live in the job log
        # alone.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: |
            viewer-smoke.png
            viewer-smoke.json
            fixture/viewer-smoke.png
            fixture/viewer-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: static-replay-viewer
          path: dist/static-replay-viewer
          if-no-files-found: error
          retention-days: 14
