# ONE service, because the manifest image placeholder is derived from the
# compose service name by uppercasing and mapping "-" to "_"
# ({{SNAKE_ROYALE_IMAGE}}). {{GAME_IMAGE}} is not a thing.
#
# ONE image, TWO entrypoints: /bin/snake-royale (the game server, which makes
# every LLM call) and /bin/snake-royale-player (the thin seat registrar). The
# whole policy set is env-switched inside this same image (PLAYER_PROMPT vs
# PLAYER_SCRIPTED), which is what keeps a champion and a scripted filler
# byte-identical apart from their environment.
services:
  snake-royale:
    image: coworld-snake-royale:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
