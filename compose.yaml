# ONE service, because the manifest image placeholder is derived from the
# compose service name by uppercasing and mapping "-" to "_"
# ({{SNAKE_ROYALE_IMAGE}}). {{GAME_IMAGE}} is not a thing.
#
# ONE image, TWO entrypoints: /bin/snake-royale (the game server) and
# /bin/snake-royale-player (the seat policy). Prompt, scripted, numeric, and
# Jev players are selected by environment from this same image.
services:
  snake-royale:
    image: coworld-snake-royale:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      network: host
